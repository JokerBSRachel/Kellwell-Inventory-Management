
{% if signoff %}
<p>Signed off by {{ signoff.manager }} at {{ signoff.signed_at|date:"m/d/y g:i A T" }}</p>
{% elif can_sign %}
<form method="post" action="{% url 'sign_off_week' week.pk %}">
    {% csrf_token %}
    <button class="signoff-button" type="submit">Sign off this week</button>
</form>
{% endif %}
