{% extends "inventory_system/base.html" %}
{% load static %}

{% block content %}
<div class="landing-page" style="text-align: center; margin-top: 100px;">
    <img src="{% static 'images/logo.png' %}" alt="Company Logo">

    {% if show_picker %}
    <h2>Select a County</h2>
    <ul style="list-style: none;">
        {% for c in counties %}
        <li><a href="?county_id={{ c.pk }}">{{ c }}</a></li>
        {% endfor %}
    </ul>
    {% endif %}
</div>
{% endblock %}
