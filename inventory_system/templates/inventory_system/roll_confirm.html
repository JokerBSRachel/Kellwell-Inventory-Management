{% extends "inventory_system/base.html" %}

{% block content %}
<div class="rollover-confirm-page">
  <h1>Roll {{ county }} to the next week?</h1>
  <p style=" font-weight: bold;">
    <span style="text-decoration: underline; color: red;">This action is irreversible.</span> Once you roll over, this week's data will be locked
    and a new week will begin. Make sure everything is correct before proceeding.
  </p>

  <form method="post">
    {% csrf_token %}
    <button class="rollover-button" type="submit">Yes, roll to next week</button>
  </form>
  <a class="cancel-button" href="{% url 'weekly_inventory' %}">Cancel</a>
</div>
{% endblock %}
